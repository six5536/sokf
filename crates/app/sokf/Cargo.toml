[package]
name = "sokf"
description = "sokf validates knowledge stores in the Superdev Open Knowledge Format (SOKF): directories of Markdown documents with YAML frontmatter, which sokf checks against their schemas. Unstable: its commands, options and file formats can change in any release."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The tests reach the public mirror and stay out of the published crate.
exclude = [
  "tests/",
  "src/**/tests.rs",
  "src/**/snapshots/",
  "src/**/fixtures.rs",
  "src/proptest_cases.rs",
  "src/test_support.rs",
  "src/query/compliance.rs",
]

[[bin]]
name = "sokf"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sokf-core.workspace = true
agent-harness-adapter-core = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
boon = { workspace = true }
dunce = { workspace = true }
proptest = { workspace = true }
