# The tasks that only sokf has. The packs supply everything else, in
# .config/mise/conf.d/.

# After the launcher's smoke test, which builds the host's binary when no
# release build has staged one.
[tasks."test:smoke:sokf"]
hide = true
depends = ["test:smoke:launcher"]
run = "node scripts/release-smoke.mts"

# github-publish.mts adds dist/share to each archive.
[tasks."build:release:ubuntu:share"]
hide = true
run = """
cargo build --release --locked -p sokf
mkdir -p dist/share
./target/release/sokf man > dist/share/sokf.1
for shell in bash zsh fish powershell elvish; do
  ./target/release/sokf completions "$shell" > "dist/share/sokf.$shell"
done
"""
